# Static files live in public/. The functions directory sits OUTSIDE it so that
# board.mjs is bundled as a function rather than served as a static file.
# Edge functions are auto-discovered from netlify/edge-functions/ and declare
# their own route via `export const config = { path: "/*" }` in gate.mjs, so
# no [[edge_functions]] entry is needed here.
[build]
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    x-robots-tag = "noindex, nofollow"

[[headers]]
  for = "/index.html"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    cache-control = "public, max-age=604800"
