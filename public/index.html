<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cured Click · Delivery Chart</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12181f; --ink2:#3d4a57; --ink3:#71808e;
  --paper:#f6f8fa; --panel:#fff;
  --rule:#e2e8ee; --rule2:#c7d1db; --band:#f1f5f8;
  --teal:#0e7c86; --teal-ink:#0a5c64; --teal-soft:#d8ecee;
  --amber:#a2660a; --amber-soft:#faf0dc;
  --red:#b3261e; --red-soft:#fbe6e4;
  --lab-green:#2f7d4f; --lab-orange:#c2700e; --lab-blue:#2a5fa8; --lab-sky:#0e7c86; --lab-none:#8c99a6;
  --row-h:34px; --grp-h:34px; --headtrack-h:96px; --labcol:270px;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding:22px clamp(14px,3vw,34px) 60px;
}
.wrap{max-width:1500px;margin:0 auto}

/* ── masthead ─────────────────────────────────────────────── */
.masthead{
  display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;
  padding-bottom:14px;border-bottom:2px solid var(--ink);
}
.eyebrow{
  font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:4px;
}
.masthead h1{font-size:clamp(26px,3.6vw,40px);line-height:1;letter-spacing:-.025em;font-weight:600;margin:0}
.goal{text-align:right;font-family:var(--mono)}
.goal-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.goal-days{font-size:34px;font-weight:600;line-height:1;letter-spacing:-.03em;color:var(--teal-ink);display:block}
.goal-days.tight{color:var(--red)}
.goal-date{font-size:12px;color:var(--ink2)}
.goal-date input{
  font:inherit;font-size:12px;border:1px solid var(--rule2);background:var(--panel);
  border-radius:3px;padding:2px 5px;color:var(--ink);
}

/* ── vitals strip ─────────────────────────────────────────── */
.vitals{display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-top:0;background:var(--panel)}
.vital{flex:1 1 118px;padding:10px 14px;border-right:1px solid var(--rule);min-width:0}
.vital:last-child{border-right:0}
.vital-n{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1;letter-spacing:-.02em;display:block}
.vital-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.vital.is-red .vital-n{color:var(--red)}
.vital.is-amber .vital-n{color:var(--amber)}

/* ── controls ─────────────────────────────────────────────── */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 10px}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:3px;overflow:hidden;background:var(--panel)}
.seg button{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  border:0;background:transparent;color:var(--ink2);padding:6px 11px;cursor:pointer;
  border-right:1px solid var(--rule);
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:hover:not([aria-pressed="true"]){background:var(--band)}
.status{
  margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink3);
  display:flex;align-items:center;gap:7px;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink3);flex:none}
.dot.live{background:var(--teal)}
.dot.snap{background:var(--amber)}
.status button{
  font:inherit;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--rule2);
  background:var(--panel);border-radius:3px;padding:4px 9px;cursor:pointer;color:var(--ink2);
}
.status button:hover{background:var(--band)}

/* ── chart shell ──────────────────────────────────────────── */
.chart{display:flex;border:1px solid var(--rule);background:var(--panel);position:relative}
.col-lab{width:var(--labcol);flex:none;border-right:2px solid var(--ink);position:relative;z-index:3;background:var(--panel)}
.grip{
  position:absolute;top:0;bottom:0;right:-5px;width:11px;cursor:col-resize;z-index:6;
  background:transparent;border:0;padding:0;
}
.grip::after{
  content:"";position:absolute;top:0;bottom:0;left:4px;width:3px;background:var(--teal);
  opacity:0;transition:opacity .12s;
}
.grip:hover::after,.grip:focus-visible::after,body.resizing .grip::after{opacity:1}
.grip:focus-visible{outline:none}
body.resizing{cursor:col-resize;user-select:none}
.lab-head{height:var(--headtrack-h);border-bottom:1px solid var(--rule2);display:flex;align-items:flex-end;padding:0 12px 8px}
.lab-head span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.col-track{flex:1;overflow-x:auto;overflow-y:hidden;min-width:0}
.inner{position:relative}

/* ruler */
.ruler{height:26px;border-bottom:1px solid var(--rule);position:relative}
.month{position:absolute;top:0;height:26px;border-left:1px solid var(--rule2);display:flex;align-items:center;padding-left:7px}
.month span{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.month.q-edge{border-left:2px solid var(--ink)}

/* trace = signature element */
.trace-wrap{height:70px;border-bottom:1px solid var(--rule2);position:relative}
.trace{display:block}
.trace-cap{
  position:absolute;left:8px;top:6px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);pointer-events:none;
}
.peak{font-family:var(--mono);font-size:10px;font-weight:600;fill:var(--ink)}

/* rows */
.grp{
  height:var(--grp-h);display:flex;align-items:center;gap:8px;padding:0 12px;
  background:var(--band);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
}
.grp-name{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.grp-n{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.grp-track{height:var(--grp-h);background:var(--band);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.row{
  height:var(--row-h);display:flex;align-items:center;gap:8px;padding:0 12px;
  border-bottom:1px solid var(--rule);overflow:hidden;
}
.row-track{height:var(--row-h);border-bottom:1px solid var(--rule);position:relative}
.row:hover,.row.hot{background:var(--teal-soft)}
.row-track.hot{background:var(--teal-soft)}
.swatch{width:3px;height:15px;flex:none;border-radius:1px;background:var(--lab-none)}
.row-name{
  font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-decoration:none;flex:1;min-width:0;
}
.row-name:hover{text-decoration:underline}
.row-when{font-family:var(--mono);font-size:10px;color:var(--ink3);flex:none}
.row-when.od{color:var(--red);font-weight:600}
.row-when.soon{color:var(--amber);font-weight:600}

/* week bands behind rows */
.bands{position:absolute;inset:0;pointer-events:none;z-index:0}
.band{position:absolute;top:0;bottom:0;background:var(--band);opacity:.55}
.wk{position:absolute;top:0;bottom:0;width:1px;background:var(--rule)}
.mo{position:absolute;top:0;bottom:0;width:1px;background:var(--rule2)}

/* markers */
.mk{
  position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
  transform:rotate(45deg);background:var(--teal);border:1px solid var(--teal-ink);
  cursor:pointer;z-index:2;
}
.mk:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.mk.od{background:var(--red);border-color:#8a1c16}
.mk.soon{background:var(--amber);border-color:#7d4e07}
.mk.done{background:var(--panel);border-color:var(--rule2)}
.mk:hover{transform:rotate(45deg) scale(1.35)}
.bar{
  position:absolute;top:50%;height:11px;margin-top:-5.5px;background:var(--teal-soft);
  border:1px solid var(--teal);border-radius:2px;z-index:1;
}
.bar.implied{background:transparent;border:1px dashed var(--rule2);height:9px;margin-top:-4.5px}

/* vertical lines */
.vline{position:absolute;top:26px;bottom:0;width:1px;z-index:4;pointer-events:none}
.vline.today{background:var(--red)}
.vline.goal{background:var(--teal);width:0;border-left:2px dashed var(--teal)}
.flag{
  position:absolute;top:-25px;font-family:var(--mono);font-size:9.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:#fff;padding:2px 6px;white-space:nowrap;
}
.vline.today .flag{background:var(--red)}
.vline.goal .flag{background:var(--teal);left:-2px}

/* tooltip */
.tip{
  position:fixed;z-index:50;background:var(--ink);color:#fff;padding:9px 11px;max-width:290px;
  border-radius:4px;pointer-events:none;opacity:0;transition:opacity .09s;font-size:12px;line-height:1.4;
  box-shadow:0 6px 20px rgba(18,24,31,.28);
}
.tip.on{opacity:1}
.tip-t{font-weight:600;margin-bottom:5px}
.tip-m{font-family:var(--mono);font-size:10px;color:#9fb0bd;letter-spacing:.05em;text-transform:uppercase}

/* undated */
.undated{margin-top:20px;border:1px solid var(--rule);background:var(--panel)}
.undated>summary{
  padding:11px 14px;cursor:pointer;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink2);
}
.undated>summary:hover{background:var(--band)}
.undated-body{border-top:1px solid var(--rule);padding:12px 14px}
.undated-note{font-size:12.5px;color:var(--ink2);margin:0 0 10px;max-width:70ch}
.ul-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 18px}
.ul-item{display:flex;align-items:center;gap:7px;padding:3px 0;min-width:0}
.ul-item a{font-size:12.5px;color:var(--ink);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ul-item a:hover{text-decoration:underline}
.ul-list{font-family:var(--mono);font-size:9.5px;color:var(--ink3);flex:none}
.empty{padding:26px 14px;text-align:center;color:var(--ink3);font-size:13px}

.foot{margin-top:18px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink3)}
.foot a{color:var(--teal-ink)}

@media (max-width:760px){
  :root{--labcol:170px}
  .row-when{display:none}
  .goal{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .mk:hover{transform:rotate(45deg)}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div>
      <span class="eyebrow">Cured Click · Trello board</span>
      <h1>Delivery chart</h1>
    </div>
    <div class="goal">
      <div class="goal-label">Quarter goal</div>
      <span class="goal-days" id="goalDays">–</span>
      <div class="goal-date">
        <input type="date" id="goalInput" aria-label="Quarter goal date">
      </div>
    </div>
  </header>

  <section class="vitals" id="vitals"></section>

  <div class="controls">
    <div class="seg" role="group" aria-label="Date window">
      <button data-win="quarter" aria-pressed="true">Quarter</button>
      <button data-win="90" aria-pressed="false">Next 90d</button>
      <button data-win="all" aria-pressed="false">All dated</button>
    </div>
    <div class="seg" role="group" aria-label="Grouping">
      <button data-grp="list" aria-pressed="true">By status</button>
      <button data-grp="label" aria-pressed="false">By stream</button>
    </div>
    <div class="seg" role="group" aria-label="Include completed">
      <button data-done="off" aria-pressed="true">Hide done</button>
      <button data-done="on" aria-pressed="false">Show done</button>
    </div>
    <div class="status">
      <span class="dot" id="dot"></span><span id="src">loading</span>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </div>

  <div class="chart">
    <div class="col-lab">
      <div class="lab-head"><span>Card</span></div>
      <div id="labs"></div>
      <button class="grip" id="grip" type="button" aria-label="Resize card column — drag, or use arrow keys. Double-click to reset."></button>
    </div>
    <div class="col-track" id="scroller">
      <div class="inner" id="inner">
        <div class="ruler" id="ruler"></div>
        <div class="trace-wrap">
          <div class="trace-cap">Due-date load · cards per week</div>
          <svg class="trace" id="trace" aria-hidden="true"></svg>
        </div>
        <div id="tracks"></div>
      </div>
    </div>
  </div>

  <details class="undated" id="undated"></details>

  <p class="foot">Source: <a href="https://trello.com/b/AXZ7BiTv/cured-click" id="boardLink">Cured Click board</a> · diamonds are due dates. Solid bars span a card's Trello start date to its due date; dashed bars span from today. Drag the divider beside the card column to widen it.</p>
</div>

ication-to-api","list":"Done","due":null,"start":null,"labels":[{"name":"Engineering","color":"green"}]},{"id":"696ff0552e597aa78d9c9520","name":"[ENG] Implement Audit Logging","url":"https://trello.com/c/cgLUqHer/33-eng-implement-audit-logging","list":"Done","due":null,"start":null,"labels":[{"name":"Engineering","color":"green"}]},{"id":"695e241be341ca56c0fa3860","name":"OVERDUE invoice for Cured Click AC0000865877","url":"https://trello.com/c/HgmGuhkP/26-overdue-invoice-for-cured-click-ac0000865877","list":"Done","due":null,"start":null,"labels":[]},{"id":"69778108939635836bc4cb66","name":"[ENG] Clean up unused API modules","url":"https://trello.com/c/Bo4xzfoq/37-eng-clean-up-unused-api-modules","list":"Done","due":null,"start":null,"labels":[{"name":"Engineering","color":"green"}]},{"id":"69404c4d9b29168d30d24dc6","name":"[ENG] Platform Robustness","url":"https://trello.com/c/f2f2qi1P/8-eng-platform-robustness","list":"Done","due":null,"start":null,"labels":[{"name":"Engineering","color":"green"}]},{"id":"695e2258754be8b8ccefa371","name":"Notice of a potential fine from the Information Commissioner's Office ICO:00012727833","url":"https://trello.com/c/n7m9GoXM/27-notice-of-a-potential-fine-from-the-information-commissioners-office-ico00012727833","list":"Done","due":null,"start":null,"labels":[]},{"id":"695e220d48b8f7e65ecb6913","name":"Agency Account Services (MHRA Devices) - Registration Renewal Reminder. [Cured Click Ltd]","url":"https://trello.com/c/xoMgAzkW/28-agency-account-services-mhra-devices-registration-renewal-reminder-cured-click-ltd","list":"Done","due":"2026-01-16T18:20:00.000Z","start":null,"labels":[]},{"id":"695ab72b09d0976c6d577bfa","name":"Hasan & Fahed - New Cured Click website meeting","url":"https://trello.com/c/HnnTFywJ/25-hasan-fahed-new-cured-click-website-meeting","list":"Done","due":null,"start":null,"labels":[]},{"id":"695aa733cab719d9c261d409","name":"Reply to Request for product demo","url":"https://trello.com/c/EIu77ZdB/15-reply-t ]},{"id":"6a478b5c84197c974c895c4a","name":"Respond to Ben on WP SoW","url":"https://trello.com/c/XqlVyIkA/165-respond-to-ben-on-wp-sow","list":"Done","due":null,"start":null,"labels":[{"name":"Engineering","color":"green"}]},{"id":"696817d20cc1e264d739b4e4","name":"Superdrug Security Assessment - Documents/ information required","url":"https://trello.com/c/Bw1cFdmN/29-superdrug-security-assessment-documents-information-required","list":"Done","due":"2026-01-15T23:00:00.000Z","start":null,"labels":[{"name":"Engineering","color":"green"},{"name":"Corporate","color":"orange"}]}]}</script>
<script>
/* ══ config ═══════════════════════════════════════════════════
   Set your quarter goal date here. It is also editable in the UI. */
const CONFIG = {
  goalDate:  "2026-10-01",
  goalName:  "Q3 goal",
  quarterStart: "2026-07-01",
  quarterEnd:   "2026-09-30",
  pxPerDay: 15
};
/* ═════════════════════════════════════════════════════════════ */

const LIST_ORDER = ["In Progress","To Do","Review / Testing","Blocked / Waiting","Backlog","Other","Done"];
const LABEL_HEX = {green:"var(--lab-green)",orange:"var(--lab-orange)",blue:"var(--lab-blue)",sky_dark:"var(--lab-sky)",sky:"var(--lab-sky)"};
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAY = 864e5;

let CARDS = [], SRC = "snapshot", CAPTURED = "";
let win = "quarter", grp = "list", showDone = false;

const $ = id => document.getElementById(id);
const d0 = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const today = d0(new Date());
const parseDay = s => s ? d0(new Date(s)) : null;
const days = (a,b) => Math.round((d0(b) - d0(a)) / DAY);
const fmt = d => `${String(d.getDate()).padStart(2,"0")} ${MONTHS[d.getMonth()]}`;
const goal = () => d0(new Date($("goalInput").value || CONFIG.goalDate));

/* ── load ──────────────────────────────────────────────────── */
function normalise(raw){
  return raw.map(c => ({
    id:c.id, name:c.name, url:c.url,
    list:c.list || "Other",
    due:parseDay(c.due), start:parseDay(c.start),
    labels:c.labels || []
  }));
}
function loadSnapshot(){
  const s = JSON.parse($("snapshot").textContent);
  CARDS = normalise(s.cards); CAPTURED = s.capturedAt || ""; SRC = "snapshot";
  if (s.boardUrl) $("boardLink").href = s.boardUrl;
}
async function loadLive(){
  const r = await fetch("/.netlify/functions/board", {cache:"no-store"});
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (!Array.isArray(j.cards)) throw new Error("bad payload");
  CARDS = normalise(j.cards); SRC = "live"; CAPTURED = "";
}
async function boot(){
  loadSnapshot();
  try { await loadLive(); } catch(e) { /* stay on snapshot */ }
  paintStatus(); render();
}
function paintStatus(){
  const live = SRC === "live";
  $("dot").className = "dot " + (live ? "live" : "snap");
  $("src").textContent = live
    ? "live from Trello"
    : (CAPTURED ? "snapshot " + CAPTURED + " · add credentials for live" : "snapshot");
}

/* ── selection ─────────────────────────────────────────────── */
const isDone = c => c.list === "Done";
/* Done always sinks to the bottom; unknown lists sit just above it. */
const listRank = name => {
  if (name === "Done") return 900;
  const i = LIST_ORDER.indexOf(name);
  return i === -1 ? 800 : i;
};
function windowRange(){
  const dated = CARDS.filter(c => c.due);
  if (win === "quarter") return [d0(new Date(CONFIG.quarterStart)), d0(new Date(CONFIG.quarterEnd))];
  if (win === "90") return [new Date(+today - 7*DAY), new Date(+today + 90*DAY)];
  if (!dated.length) return [today, new Date(+today + 30*DAY)];
  const ds = dated.map(c => +c.due);
  return [new Date(Math.min(...ds) - 5*DAY), new Date(Math.max(...ds) + 5*DAY)];
}
function visible([a,b]){
  return CARDS.filter(c =>
    c.due && c.due >= a && c.due <= b && (showDone || !isDone(c))
  ).sort((x,y) => x.due - y.due);
}
function groupsOf(cards){
  const m = new Map();
  for (const c of cards){
    const keys = grp === "list"
      ? [c.list]
      : (c.labels.length ? c.labels.map(l => l.name) : ["Unlabelled"]);
    for (const k of keys) (m.get(k) || m.set(k,[]).get(k)).push(c);
  }
  const keys = [...m.keys()].sort((a,b) => grp === "list"
    ? listRank(a) - listRank(b)
    : m.get(b).length - m.get(a).length);
  return keys.map(k => [k, m.get(k)]);
}
const swatchOf = c => c.labels.length ? (LABEL_HEX[c.labels[0].color] || "var(--lab-none)") : "var(--lab-none)";
function urgency(c){
  if (isDone(c)) return "done";
  const n = days(today, c.due);
  return n < 0 ? "od" : n <= 7 ? "soon" : "";
}
function whenText(c){
  const n = days(today, c.due);
  if (isDone(c)) return fmt(c.due);
  if (n < 0) return `${-n}d over`;
  if (n === 0) return "today";
  return `${n}d`;
}

/* ── vitals ────────────────────────────────────────────────── */
function renderVitals(){
  const open = CARDS.filter(c => !isDone(c));
  const dated = open.filter(c => c.due);
  const g = goal();
  const cells = [
    ["open cards", open.length, ""],
    ["overdue", dated.filter(c => c.due < today).length, "is-red"],
    ["due in 7 days", dated.filter(c => c.due >= today && days(today,c.due) <= 7).length, "is-amber"],
    ["due by goal", dated.filter(c => c.due >= today && c.due <= g).length, ""],
    ["no due date", open.length - dated.length, ""],
    ["shipped", CARDS.filter(isDone).length, ""]
  ];
  $("vitals").innerHTML = cells.map(([k,n,cls]) =>
    `<div class="vital ${n ? cls : ""}"><span class="vital-n">${n}</span><span class="vital-k">${k}</span></div>`
  ).join("");

  const left = days(today, g);
  const el = $("goalDays");
  el.textContent = left < 0 ? `${-left}d past` : `${left}d`;
  el.className = "goal-days" + (left <= 21 ? " tight" : "");
}

/* ── chart ─────────────────────────────────────────────────── */
function render(){
  renderVitals();
  const [a,b] = windowRange();
  const total = Math.max(days(a,b), 1);
  const W = total * CONFIG.pxPerDay;
  const x = d => days(a,d) * CONFIG.pxPerDay;
  $("inner").style.width = W + "px";

  const cards = visible([a,b]);

  /* ruler */
  let ruler = "";
  const cur = new Date(a.getFullYear(), a.getMonth(), 1);
  while (cur <= b){
    const ms = new Date(cur), me = new Date(cur.getFullYear(), cur.getMonth()+1, 0);
    const s = Math.max(+ms, +a), e = Math.min(+me, +b);
    if (e >= s){
      const l = x(new Date(s)), w = x(new Date(e)) - l + CONFIG.pxPerDay;
      const qEdge = ms.getMonth() % 3 === 0 && +ms >= +a;
      ruler += `<div class="month${qEdge ? " q-edge" : ""}" style="left:${l}px;width:${w}px"><span>${MONTHS[ms.getMonth()]} ${String(ms.getFullYear()).slice(2)}</span></div>`;
    }
    cur.setMonth(cur.getMonth()+1);
  }
  $("ruler").innerHTML = ruler;

  /* trace: weekly due-date load */
  const wk0 = new Date(a); wk0.setDate(wk0.getDate() - ((wk0.getDay()+6) % 7));
  const buckets = [];
  for (let t = new Date(wk0); t <= b; t.setDate(t.getDate()+7)){
    const s = new Date(t), e = new Date(+t + 7*DAY);
    buckets.push({s, e, n: cards.filter(c => c.due >= s && c.due < e && !isDone(c)).length});
  }
  const peak = Math.max(1, ...buckets.map(k => k.n));
  const H = 70, pad = 12, base = H - 8;
  const yOf = n => base - (n / peak) * (base - pad);
  let path = `M0,${base}`;
  buckets.forEach(k => {
    const x1 = Math.max(0, x(k.s)), x2 = Math.min(W, x(k.e));
    path += ` L${x1},${yOf(k.n)} L${x2},${yOf(k.n)}`;
  });
  path += ` L${W},${base} Z`;
  const top = buckets.reduce((m,k) => k.n > m.n ? k : m, buckets[0] || {n:0});
  const labels = buckets.filter(k => k.n > 0).map(k =>
    `<text class="peak" x="${Math.max(0,x(k.s)) + 5}" y="${yOf(k.n) - 5}">${k.n}</text>`).join("");
  $("trace").setAttribute("viewBox", `0 0 ${W} ${H}`);
  $("trace").setAttribute("width", W); $("trace").setAttribute("height", H);
  $("trace").innerHTML =
    `<path d="${path}" fill="var(--teal-soft)" stroke="var(--teal)" stroke-width="1.5"/>
     <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--rule2)" stroke-width="1"/>${labels}`;

  /* rows */
  if (!cards.length){
    $("labs").innerHTML = `<div class="empty">No cards with due dates in this window.</div>`;
    $("tracks").innerHTML = "";
  } else {
    let labs = "", trks = "";
    const gridFor = () => {
      let g = `<div class="bands">`;
      for (let t = new Date(wk0); t <= b; t.setDate(t.getDate()+7)){
        const l = x(new Date(t));
        if (l >= 0) g += `<div class="wk" style="left:${l}px"></div>`;
      }
      const m = new Date(a.getFullYear(), a.getMonth()+1, 1);
      while (m <= b){ g += `<div class="mo" style="left:${x(m)}px"></div>`; m.setMonth(m.getMonth()+1); }
      return g + `</div>`;
    };
    for (const [name, list] of groupsOf(cards)){
      labs += `<div class="grp"><span class="grp-name">${esc(name)}</span><span class="grp-n">${list.length}</span></div>`;
      trks += `<div class="grp-track"></div>`;
      list.forEach(c => {
        const u = urgency(c);
        labs += `<div class="row" data-id="${c.id}">
          <span class="swatch" style="background:${swatchOf(c)}"></span>
          <a class="row-name" href="${c.url}" target="_blank" rel="noopener" title="${esc(c.name)}">${esc(c.name)}</a>
          <span class="row-when ${u}">${whenText(c)}</span></div>`;
        const bar = spanBar(c, x, a, b);
        trks += `<div class="row-track" data-id="${c.id}">${gridFor()}${bar}
          <a class="mk ${u}" style="left:${x(c.due)}px" href="${c.url}" target="_blank" rel="noopener"
             data-id="${c.id}" aria-label="${esc(c.name)}, due ${fmt(c.due)}"></a></div>`;
      });
    }
    $("labs").innerHTML = labs;
    $("tracks").innerHTML = trks;
  }

  /* today + goal lines */
  $("inner").querySelectorAll(".vline").forEach(n => n.remove());
  const line = (d, cls, text) => {
    if (d < a || d > b) return;
    const el = document.createElement("div");
    el.className = "vline " + cls;
    el.style.left = x(d) + "px";
    el.innerHTML = `<span class="flag">${text}</span>`;
    $("inner").appendChild(el);
  };
  line(goal(), "goal", CONFIG.goalName + " · " + fmt(goal()));
  line(today, "today", "Today");

  wireHover();
  if (win !== "all") queueMicrotask(() => {
    $("scroller").scrollLeft = Math.max(0, x(today) - 180);
  });
}

/* Span behind a card: real start→due where Trello has a start date,
   otherwise an implied today→due (or due→today when overdue). */
function spanBar(c, x, a, b){
  if (isDone(c)) return "";
  const real = c.start && c.start < c.due;
  const from = real ? c.start : today;
  const [s,e] = from <= c.due ? [from, c.due] : [c.due, from];
  const cs = Math.max(+s, +a), ce = Math.min(+e, +b);
  if (ce <= cs) return "";
  const l = x(new Date(cs)), w = Math.max(3, x(new Date(ce)) - l);
  return `<div class="bar${real ? "" : " implied"}" style="left:${l}px;width:${w}px"></div>`;
}

const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

/* ── hover linkage + tooltip ───────────────────────────────── */
function wireHover(){
  const tip = $("tip");
  const pair = id => [...document.querySelectorAll(`[data-id="${id}"]`)];
  const on = (id, state) => pair(id).forEach(n => n.classList.toggle("hot", state));

  document.querySelectorAll(".row,.row-track").forEach(n => {
    n.addEventListener("mouseenter", () => on(n.dataset.id, true));
    n.addEventListener("mouseleave", () => on(n.dataset.id, false));
  });
  document.querySelectorAll(".mk").forEach(n => {
    const show = () => {
      const c = CARDS.find(k => k.id === n.dataset.id); if (!c) return;
      const n2 = days(today, c.due);
      const state = isDone(c) ? "shipped"
        : n2 < 0 ? `${-n2} days overdue`
        : n2 === 0 ? "due today" : `${n2} days remaining`;
      const streams = c.labels.map(l => l.name).join(" · ") || "no stream";
      tip.innerHTML = `<div class="tip-t">${esc(c.name)}</div>
        <div class="tip-m">${esc(c.list)} · ${streams}</div>
        <div class="tip-m">due ${fmt(c.due)} · ${state}</div>`;
      const r = n.getBoundingClientRect();
      tip.classList.add("on");
      const w = tip.offsetWidth, h = tip.offsetHeight;
      tip.style.left = Math.min(Math.max(8, r.left + 6), innerWidth - w - 8) + "px";
      tip.style.top = (r.top - h - 10 < 8 ? r.bottom + 10 : r.top - h - 10) + "px";
    };
    const hide = () => tip.classList.remove("on");
    n.addEventListener("mouseenter", show);
    n.addEventListener("focus", show);
    n.addEventListener("mouseleave", hide);
    n.addEventListener("blur", hide);
  });
}

/* ── undated backlog ───────────────────────────────────────── */
function renderUndated(){
  const list = CARDS.filter(c => !c.due && !isDone(c))
    .sort((a,b) => listRank(a.list) - listRank(b.list) || a.name.localeCompare(b.name));
  $("undated").innerHTML =
    `<summary>${list.length} open cards have no due date — invisible on the chart above</summary>
     <div class="undated-body">
       <p class="undated-note">A card only appears on the chart once it has a due date in Trello. Add dates to the ones that matter for the quarter goal and they will show up here on the next refresh.</p>
       <div class="ul-grid">${list.map(c =>
         `<div class="ul-item"><span class="swatch" style="background:${swatchOf(c)}"></span>
          <a href="${c.url}" target="_blank" rel="noopener">${esc(c.name)}</a>
          <span class="ul-list">${esc(c.list)}</span></div>`).join("")}</div>
     </div>`;
}

/* ── controls ──────────────────────────────────────────────── */
document.querySelectorAll(".seg").forEach(seg => {
  seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    [...seg.children].forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    if (b.dataset.win) win = b.dataset.win;
    if (b.dataset.grp) grp = b.dataset.grp;
    if (b.dataset.done) showDone = b.dataset.done === "on";
    render();
  });
});
/* ── resizable card column ─────────────────────────────────── */
const LAB_MIN = 150, LAB_MAX = 900, LAB_KEY = "cc-labcol";
function setLabCol(px){
  const v = Math.round(Math.min(LAB_MAX, Math.max(LAB_MIN, px)));
  document.documentElement.style.setProperty("--labcol", v + "px");
  try { localStorage.setItem(LAB_KEY, v); } catch(e) {}
}
(function wireGrip(){
  const grip = $("grip");
  let saved = null;
  try { saved = localStorage.getItem(LAB_KEY); } catch(e) {}
  if (saved) setLabCol(+saved);

  let x0 = 0, w0 = 0;
  const move = e => setLabCol(w0 + (e.clientX - x0));
  const up = () => {
    document.body.classList.remove("resizing");
    removeEventListener("pointermove", move);
    removeEventListener("pointerup", up);
  };
  grip.addEventListener("pointerdown", e => {
    e.preventDefault();
    x0 = e.clientX;
    w0 = document.querySelector(".col-lab").getBoundingClientRect().width;
    document.body.classList.add("resizing");
    addEventListener("pointermove", move);
    addEventListener("pointerup", up);
  });
  grip.addEventListener("dblclick", () => setLabCol(270));
  grip.addEventListener("keydown", e => {
    const step = e.shiftKey ? 40 : 12;
    const w = document.querySelector(".col-lab").getBoundingClientRect().width;
    if (e.key === "ArrowLeft") { setLabCol(w - step); e.preventDefault(); }
    if (e.key === "ArrowRight") { setLabCol(w + step); e.preventDefault(); }
  });
})();

$("goalInput").value = CONFIG.goalDate;
$("goalInput").addEventListener("change", render);
$("refresh").addEventListener("click", async () => {
  $("src").textContent = "refreshing";
  try { await loadLive(); } catch(e) { loadSnapshot(); }
  paintStatus(); render(); renderUndated();
});

boot().then(renderUndated);
</script>
